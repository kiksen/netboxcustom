[project]
name = "netboxcustom"
version = "0.3.1"
description = "A pynetbox wrapper and helper functions for netbox."
authors = [{ name = "Christian Knoblauch" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pynetbox",
    "jmespath",
    "rich>=14.3.3",
    "pytest>=8.3.5",
    "pytest-asyncio",
    "httpx2>=2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["netboxcustom"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 130
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["netboxcustom"]
